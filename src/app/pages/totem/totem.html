<div class="min-h-screen bg-gray-100 flex flex-col items-center justify-between py-8 px-5 md:py-20 md:px-10">

  <!-- Topo: Ícone + Título -->
  <div class="flex flex-col items-center gap-6 md:gap-20">
    <!-- Ícone senha -->
     <span class="bg-white p-3 md:p-5 rounded-full shadow-md">
         <img src="icons/ticket.svg" alt="" class="w-7 md:w-10">
     </span>
    <h1 class="text-2xl md:text-5xl font-black text-blue-600 uppercase tracking-widest text-center">Retire sua Senha</h1>
  </div>

  <!-- Botões de tipo de senha -->
  <div class="flex flex-col gap-4 md:gap-15 w-full max-w-3xl">

    <!-- Normal -->
    <button (click)="openModal('normal')" class="flex items-center justify-between bg-white rounded-3xl shadow-xl px-5 py-5 md:px-10 md:py-8 active:scale-95 transition-transform">
      <div class="flex items-center gap-3 md:gap-6">
        <span class="bg-blue-50 rounded-full p-3 md:p-5">
            <img src="icons/user.svg" alt="" class="w-10 md:w-18">
        </span>
        <span class="text-2xl md:text-5xl font-bold text-blue-600 border-l-gray-100 border-l-2 pl-3 md:pl-5">Normal</span>
      </div>
      <img src="icons/arrow-blue.svg" alt="" class="w-6 md:w-10">
    </button>

    <!-- Preferencial -->
    <button (click)="openModal('preferential')" class="flex items-center justify-between bg-white rounded-3xl shadow-xl px-5 py-5 md:px-10 md:py-8 active:scale-95 transition-transform">
      <div class="flex items-center gap-3 md:gap-6">
        <span class="bg-blue-50 rounded-full p-3 md:p-5">
            <img src="icons/old.svg" alt="" class="w-10 md:w-18">
        </span>
        <span class="text-2xl md:text-5xl font-bold text-blue-600 border-l-gray-100 border-l-2 pl-3 md:pl-5">Preferencial</span>
      </div>
      <img src="icons/arrow-blue.svg" alt="" class="w-6 md:w-10">
    </button>

    <!-- Emergencial -->
    <button (click)="openModal('emergency')" class="flex items-center justify-between bg-white rounded-3xl shadow-lg px-5 py-5 md:px-10 md:py-8 active:scale-95 transition-transform">
      <div class="flex items-center gap-3 md:gap-6">
        <span class="bg-red-100 rounded-full p-3 md:p-5">
            <img src="icons/siren.svg" alt="" class="w-10 md:w-18">
        </span>
        <span class="text-2xl md:text-5xl font-bold text-red-500 border-l-gray-100 border-l-2 pl-3 md:pl-5">Emergencial</span>
      </div>
      <img src="icons/arrow-red.svg" alt="" class="w-6 md:w-10">
    </button>

  </div>

  <!-- Modal Setores -->
  @if (showModal) {
    <div class="modal-backdrop fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-5" (click)="closeModal()">
      <div class="modal-card bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 md:p-10" (click)="$event.stopPropagation()">

        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl md:text-3xl font-black text-blue-600 uppercase tracking-widest">Selecione o Setor</h2>
          <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 active:scale-90 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <ul class="flex flex-col gap-3">
          @for (setor of setores; track setor.value) {
            <li>
              <button (click)="createTicket(setor.value)" class="w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-100 hover:border-blue-400 hover:bg-blue-50 active:scale-95 transition-all">
                <span class="text-lg md:text-2xl font-semibold text-gray-700">{{ setor.label }}</span>
              </button>
            </li>
          }
        </ul>

      </div>
    </div>
  }

  <!-- Rodapé: Toque para imprimir -->
  <div class="flex flex-col items-center gap-4">
   <img src="icons/touch.svg" alt="" class="w-10 md:w-15">
    <span class="text-sm md:text-xl font-semibold text-blue-600 uppercase tracking-widest">Toque para Imprimir</span>
  </div>

</div>
