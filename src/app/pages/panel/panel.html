<div class="min-h-screen bg-gray-100 flex items-center justify-center gap-8 ">

  <!-- Senha Atual -->
  <div class="bg-white rounded-3xl shadow-xl w-[1020px] flex flex-col items-center justify-center py-16 px-12 gap-10">
    <span class="text-3xl font-bold text-blue-600 uppercase tracking-widest">Senha Atual</span>
    <span class="text-[260px] font-bold text-gray-800 leading-none">
      @if(currentTicket){
        {{currentTicket.code}}
      }@else {
        <span>-</span>
      }
    </span>
    <hr class="w-full border border-gray-200" />
    <span class="text-4xl font-bold text-blue-600">
      @if(currentTicket){
        {{currentTicket.sector}}
      }@else {
        SETOR
      }
    </span>
  </div>

  <!-- Últimas Senhas -->
  <div class="bg-gray-100 rounded-3xl shadow-xl h-[580px] w-[420px] flex flex-col overflow-hidden">
    <div class="px-10 py-7 bg-blue-500">
      <h2 class="text-white font-bold text-3xl text-center tracking-wide">Últimas Senhas</h2>
    </div>
    <div class="flex flex-col  divide-blue-300 p-8 justify-between h-full">
      @for(ticket of previousTicket; track ticket.id){
        <div class="bg-white flex items-center rounded-2xl justify-between px-5 py-10">
          <span class="text-gray-800 font-black text-5xl">{{ticket.code.toUpperCase()}}</span>
          <span class="text-blue-600 text-2xl font-bold">{{ticket.sector.toUpperCase()}}</span>
        </div>
      }
    </div>
  </div>

</div>
